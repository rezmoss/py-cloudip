name: sync-data

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write   # PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: python -m pip install --upgrade build pytest hatch

      - name: Refresh embedded database
        run: python scripts/fetch_data.py

      - name: Detect data changes
        id: changes
        run: |
          if git diff --quiet -- src/cloudip/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no upstream data changes; exiting"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test with refreshed data
        if: steps.changes.outputs.changed == 'true'
        run: |
          python -m pip install -e .
          python -m pytest tests/ -q

      - name: Bump patch, commit, tag, push
        id: bump
        if: steps.changes.outputs.changed == 'true'
        run: |
          data_version="$(python -c "import json;print(json.load(open('src/cloudip/data/version.json'))['version'])")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          hatch version patch
          new_version="$(hatch version)"
          git add src/cloudip/data src/cloudip/__about__.py
          git commit -m "chore(data): sync cloudip-db ${data_version} (v${new_version})"
          git tag "v${new_version}"
          # Remote main may have advanced since checkout; rebase before pushing.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v${new_version}"
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "data_version=${data_version}" >> "$GITHUB_OUTPUT"

      - name: Build sdist + wheel
        if: steps.changes.outputs.changed == 'true'
        run: python -m build

      - name: Publish to PyPI (Trusted Publishing)
        if: steps.changes.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      # Tags pushed with GITHUB_TOKEN do not trigger release.yml (GitHub's
      # recursion guard), so the tag, the PyPI publish, and the GitHub Release
      # all happen here in one job to keep them in lockstep.
      - name: Create GitHub Release
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          DATA_VERSION: ${{ steps.bump.outputs.data_version }}
        run: |
          gh release view "v${NEW_VERSION}" >/dev/null 2>&1 \
            && { echo "release v${NEW_VERSION} already exists"; exit 0; }
          gh release create "v${NEW_VERSION}" dist/* \
            --title "v${NEW_VERSION}" \
            --notes "Automated weekly data sync — cloudip-db \`${DATA_VERSION}\`.

          Published to PyPI: https://pypi.org/project/py-cloudip/${NEW_VERSION}/"
