name: sync-data

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write   # PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tooling
        run: python -m pip install --upgrade build pytest hatch

      - name: Refresh embedded database
        run: python scripts/fetch_data.py

      - name: Detect data changes
        id: changes
        run: |
          if git diff --quiet -- src/cloudip/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no upstream data changes; exiting"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test with refreshed data
        if: steps.changes.outputs.changed == 'true'
        run: |
          python -m pip install -e .
          python -m pytest tests/ -q

      - name: Bump patch, commit, tag, push
        if: steps.changes.outputs.changed == 'true'
        run: |
          data_version="$(python -c "import json;print(json.load(open('src/cloudip/data/version.json'))['version'])")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          hatch version patch
          new_version="$(hatch version)"
          git add src/cloudip/data src/cloudip/__about__.py
          git commit -m "chore(data): sync cloudip-db ${data_version} (v${new_version})"
          git tag "v${new_version}"
          git push origin HEAD --tags

      - name: Build sdist + wheel
        if: steps.changes.outputs.changed == 'true'
        run: python -m build

      - name: Publish to PyPI (Trusted Publishing)
        if: steps.changes.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
